name: Published Harness smoke

on:
  pull_request:
    paths:
      - .github/workflows/published-harness-smoke.yml
      - checks/**
      - cordis.patch.yml
      - lib/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - src/**
      - tsconfig.json
      - tsdown.config.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and build
        run: pnpm run check

      - name: Check synthetic flows
        run: pnpm test

      - name: Pack reviewed artifact
        run: pnpm pack --pack-destination artifacts

      - name: Install and boot in an isolated published Harness
        env:
          DSH_VERSION: 0.2.2-rc.1
        run: node checks/published-harness-smoke.mjs
