name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and build
        run: pnpm run check

      - name: Check credentials, RPC, and OAuth flows with synthetic fixtures
        run: pnpm test

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: pnpm audit --prod --audit-level high

      - name: Pack reviewed artifact
        run: pnpm pack --pack-destination artifacts
